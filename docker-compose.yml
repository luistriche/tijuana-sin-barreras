# Docker Compose for Tijuana Sin Barreras
version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: tijuana_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tijuana_sin_barreras
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
